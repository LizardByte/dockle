[project]
name = "Dockle"
version = "0.1.0"
description = "Build documentation with multiple frameworks and one consistent theme."
repository = "https://github.com/LizardByte/dockle"
home = "docs/home.md"
logo = "branding/dockle-logo.png"

[theme]
primary = "#2962ff"
content = "#2e3440"
light_background = "#ffffff"
dark_background = "#131416"

[build]
output = "_site"
work = ".dockle"
strict = true
clean = true

[[targets]]
name = "sphinx"
title = "Sphinx example"
description = "Python and Markdown rendered by Dockle's first-party Sphinx theme."
framework = "sphinx"
source = "examples/sphinx"

[[targets]]
name = "doxygen"
title = "Doxygen example"
description = "C++ and Markdown built from a Dockle-generated Doxyfile."
framework = "doxygen"
source = "examples/doxygen"
entry = "README.md"

[[targets]]
name = "mkdocs"
title = "MkDocs example"
description = "Configuration and Markdown rendered with Dockle's MkDocs theme."
framework = "mkdocs"
source = "examples/mkdocs"

[[targets]]
name = "jsdoc"
title = "JSDoc example"
description = "JavaScript and Markdown built from Dockle-generated JSDoc configuration."
framework = "jsdoc"
source = "examples/jsdoc"
entry = "README.md"

[[targets]]
name = "rustdoc"
title = "rustdoc example"
description = "Rust and Markdown built through Cargo and normalized by Dockle."
framework = "rustdoc"
source = "examples/rustdoc"
