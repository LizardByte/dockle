---
name: CI-Release
permissions: {}

on:
  release:
    types:
      - released

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name }}"
  cancel-in-progress: true

jobs:
  pypi:
    name: PyPI
    if: >-
      github.event.action == 'released' &&
      github.repository_owner == 'LizardByte' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    environment:
      name: pypi
      url: https://pypi.org/p/lizardbyte-dockle
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Python distributions from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release download "${RELEASE_TAG}"
          --repo "${GITHUB_REPOSITORY}"
          --dir dist
          --pattern "lizardbyte_dockle-*.whl"
          --pattern "lizardbyte_dockle-*.tar.gz"

      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
