---
name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'

jobs:
  release-setup:
    name: Release Setup
    outputs:
      publish_release: ${{ steps.release-setup.outputs.publish_release }}
      release_body: ${{ steps.release-setup.outputs.release_body }}
      release_commit: ${{ steps.release-setup.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.release-setup.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.release-setup.outputs.release_tag }}
      release_version: ${{ steps.release-setup.outputs.release_version }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Release Setup
        id: release-setup
        uses: LizardByte/actions/actions/release_setup@39c468549cfb87ccb917e5e5342e18abc926dc48  # v2026.909.30231
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  pytest:
    name: Pytest (${{ matrix.os }})
    needs:
      - release-setup
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Set package version
        run: uv version --no-sync "${{ needs.release-setup.outputs.release_version }}"

      - name: Sync test dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --no-default-groups --group test --all-extras

      - name: Test with pytest
        id: test
        run: >-
          uv run --locked --no-default-groups --group test
          --all-extras --no-sync pytest

      - name: Upload test coverage
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4  # v7.1.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/python-coverage.xml
          flags: ${{ runner.os }}-python
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4  # v7.1.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./junit-python.xml
          flags: ${{ runner.os }}-python
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  python-package:
    name: Python package
    needs:
      - release-setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Set package version
        run: uv version --no-sync "${{ needs.release-setup.outputs.release_version }}"

      - name: Sync packaging dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --only-group package --no-build

      - name: Build Python distributions
        run: uv build

      - name: Check Python distributions
        run: uv run --locked --only-group package --no-build --no-sync twine check dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          if-no-files-found: error
          name: release-python
          path: dist/*
          retention-days: 30

  standalone:
    name: Standalone (${{ matrix.artifact }})
    needs:
      - release-setup
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-amd64
            binary_name: dockle-windows-amd64
            executable: dockle-windows-amd64.exe
            os: windows-latest
          - artifact: windows-arm64
            binary_name: dockle-windows-arm64
            executable: dockle-windows-arm64.exe
            os: windows-11-arm
          - artifact: linux-x86_64
            binary_name: dockle-linux-x86_64
            executable: dockle-linux-x86_64
            os: ubuntu-latest
          - artifact: linux-arm64
            binary_name: dockle-linux-arm64
            executable: dockle-linux-arm64
            os: ubuntu-24.04-arm
          - artifact: macos-arm64
            binary_name: dockle-macos-arm64
            executable: dockle-macos-arm64
            os: macos-latest
          - artifact: macos-x86_64
            binary_name: dockle-macos-x86_64
            executable: dockle-macos-x86_64
            os: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Set package version
        run: uv version --no-sync "${{ needs.release-setup.outputs.release_version }}"

      - name: Sync standalone dependencies
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --no-default-groups --group package

      - name: Build standalone executable
        run: >-
          uv run --locked --no-default-groups --group package
          --no-sync pyinstaller
          --clean
          --collect-data dockle
          --copy-metadata dockle
          --name "${{ matrix.binary_name }}"
          --noconfirm
          --onefile
          src/dockle/__main__.py

      - name: Smoke test standalone executable
        if: runner.os != 'Windows'
        env:
          EXPECTED_VERSION: ${{ needs.release-setup.outputs.release_version }}
        run: |
          actual_version="$(./dist/${{ matrix.executable }} --version)"
          test "${actual_version}" = "dockle ${EXPECTED_VERSION}"

      - name: Smoke test standalone executable on Windows
        if: runner.os == 'Windows'
        env:
          EXPECTED_VERSION: ${{ needs.release-setup.outputs.release_version }}
        run: |
          $actualVersion = .\dist\${{ matrix.executable }} --version
          if ($actualVersion -ne "dockle $env:EXPECTED_VERSION") {
            throw "Unexpected version: $actualVersion"
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          if-no-files-found: error
          name: release-standalone-${{ matrix.artifact }}
          path: dist/${{ matrix.executable }}
          retention-days: 30

  create-release:
    name: Create Release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') &&
      needs.release-setup.outputs.publish_release == 'true'
    needs:
      - python-package
      - pytest
      - release-setup
      - standalone
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true
          path: release-artifacts
          pattern: release-*

      - name: Create/Update GitHub Release
        uses: LizardByte/actions/actions/release_create@39c468549cfb87ccb917e5e5342e18abc926dc48  # v2026.909.30231
        with:
          allowUpdates: true
          artifacts: '${{ github.workspace }}/release-artifacts/*'
          body: ${{ needs.release-setup.outputs.release_body }}
          draft: true
          generateReleaseNotes: ${{ needs.release-setup.outputs.release_generate_release_notes }}
          name: ${{ needs.release-setup.outputs.release_tag }}
          prerelease: true
          tag: ${{ needs.release-setup.outputs.release_tag }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
